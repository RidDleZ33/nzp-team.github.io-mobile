	<style>
	html,body { background-color:#000000; color:#808080; height:100%;width:100%;margin:0;padding:0;}
	.emscripten { padding-right: 0; margin-left: auto; margin-right: auto; display: block; }
	div.emscripten { text-align: center; padding:0; margin: 0;}
	/* the canvas *must not* have any border or padding, or mouse coords will be wrong */
	canvas.emscripten { border: 0px none; width:100%; height:100%; padding:0; margin: 0;}
	/* --- Unofficial NZP Mobile Overlay --- */

		position: fixed; inset: 0; z-index: 9999;

	}
	.nzp-touch-control {
		position: absolute; pointer-events: auto;

		-webkit-user-select: none;
	}
	/* Virtual Joystick (bottom-left) */

	/* Look Zone (right half, above buttons) */

  <body ondrop="gotdrop(event);" ondragover="event.preventDefault()">
	<div class="emscripten" id="status">Please allow/unblock our javascript to play.</div>
	<div id="dropzone" ondrop="gotdrop(event);" ondragover="event.preventDefault()" hidden=1>Drop Zone</div>
	<button type="button" onclick="begin()" id="begin" hidden=1>Click To Begin!</button>
	<div class="emscripten">
		<progress value="0" max="100" id="progress" hidden=1></progress>  
	</div>
	<canvas class="emscripten" id="canvas" oncontextmenu="event.preventDefault()" hidden=1></canvas>
	<script type='text/javascript'>
// connect to canvas
var Module = {
	files:
	{
		"default.fmf" : "default.fmf",
		"nzp/game.pk3" : "nzp/game.pk3",
		"nzp/progs.pk3" : "nzp/progs.pk3"
	},
	print: function(msg)
	{	//stdout...
		console.log(msg);
	},
	printErr: function(text)
	{	//stderr...
		console.log(text);
	},
	canvas: document.getElementById('canvas'),	//for webgl to attach to
	setStatus: function(text)
	{	//gets spammed some prints during startup. blame emscripten.
		if (Module.setStatus.interval)
			clearInterval(Module.setStatus.interval);
		var m = text.match(/([^(]+)\((\d+(\.\d+)?)\/(\d+)\)/);
		var statusElement = document.getElementById('status');
		var progressElement = document.getElementById('progress');
		if (m) {
			text = m[1];
			progressElement.value = parseInt(m[2])*100;
			progressElement.max = parseInt(m[4])*100;
			progressElement.hidden = false;
		} else {
			progressElement.value = null;
			progressElement.max = null;
			progressElement.hidden = true;
		}
		statusElement.innerHTML = text;
		statusElement.hidden = text.length==0;
	},
//	preRun: [],
	totalDependencies: 0,
	monitorRunDependencies: function(left)
	{	//progress is progress...
		this.totalDependencies = Math.max(this.totalDependencies, left);
		Module.setStatus(left ? 'Preparing... (' + (this.totalDependencies-left) + '/' + this.totalDependencies + ')' : 'All downloads complete.');
	},
//	onRuntimeInitialized: function(){},
	postRun:
	[	//each of these are called after main was run. we should have our mainloop set up now
		function()
		{
			if (Module["sched"] === undefined)
			{	//our main function failed to set up the main loop. ie: main didn't get called. panic.
				alert("Unable to initialise. You may need to restart your browser. If you get this often and inconsistently, consider using a 64bit browser instead.");
				Module.setStatus("Initialisation Failure");
			}
		}
	],
};
function begin()
{
	if (Module.began)
		return;
	Module.began = true;
	document.getElementById('dropzone').hidden = true;
	document.getElementById('begin').hidden = true;
	Module.setStatus('Downloading...');

	// make a script. do it the hard way for the error.
	var s = document.createElement('script');
	// set it up
	s.setAttribute('src',"ftewebgl.js");
	s.setAttribute('type',"text/javascript");
	s.setAttribute('charset',"utf-8");
	s.addEventListener('error', function() {alert("Oh noes! we got an error!"); Module.setStatus("Unable to download engine javascript");}, false);
	// add to DOM
	document.head.appendChild(s);
}

//stuff to facilitate our drag+drop filesystem support
function fixupfilepath(fname, path)
{	//we just have a filename, try to guess where to put it.
	if (path != "")
		return path+fname;	//already has a path. use it. this allows people to drag+drop gamedirs.
	var ext = fname.substr(fname.lastIndexOf('.') + 1);
	if (ext == 'fmf' || ext == 'kpf')	//these are the only files that really make sense in the root.
		return fname;
	if (ext == 'bsp' || ext == 'map' || ext == 'lit' || ext == 'lux')
		return "id1/maps/" + fname;	//bsps get their own extra subdir
	return "id1/" + fname;	//probably a pak. maybe a cfg, no idea really.
}
function showfiles()
{	//print the pending file list in some pretty way
	if (Module.began)
		return;
	Module.setStatus('');
	document.getElementById('dropzone').hidden = false;
	document.getElementById('begin').hidden = false;
	var nt = "Drag gamedirs or individual package files here to make them available!<br/>Active Files:<br/><pre>";
	var keys = Object.keys(Module.files);
	for(var i = 0; i < keys.length; i++)
	{
		if (Module.files[keys[i]] instanceof ArrayBuffer)
		{
			var sz = Module.files[keys[i]].byteLength;
			if (sz > 512*1024)
				sz = (sz / (1024*1024)) + "mb";
			else if (sz > 512)
				sz = (sz / 1024) + "kb";
			else
				sz = (sz) + " bytes";
			nt += "    " + keys[i] + " ("+sz+")<br/>";
		}
		else
			nt += "    " + keys[i] + "<br/>";
	}
	nt += "</pre>("+keys.length+" files)";
	document.getElementById('dropzone').innerHTML = nt;
}
function scanfiles(item,path)
{	//for directory drops
	if (item.isFile)
	{
		item.file(function(f)
		{
			let n = fixupfilepath(f.name, path);
			Module.files[n]=f.arrayBuffer();	//actually a promise...
			Module.files[n].then(buf=>{Module.files[n]=buf;showfiles();});	//try and resolve it now.
    	});
	}
	else if (item.isDirectory)
	{
		// Get folder contents
		var dirReader = item.createReader();
		dirReader.readEntries(function(entries)
		{
			for (var i=0; i<entries.length; i++)
				scanfiles(entries[i], path + item.name + "/");
		});
	}
}
function gotdrop(ev)
{	//user drag+dropped something. 
	ev.preventDefault();
	for (var i = 0; i < ev.dataTransfer.items.length; i++)
		if (ev.dataTransfer.items[i].webkitGetAsEntry)
		{
			var d = ev.dataTransfer.items[i].webkitGetAsEntry();
			if (d)
				scanfiles(d, "");
		}
		else if (ev.dataTransfer.items[i].kind === 'file')
		{
			var f = ev.dataTransfer.items[i].getAsFile();
			var n = fixupfilepath(f.name);
			Module.files[n]=f.arrayBuffer();	//actually a promise...
			Module.files[n].then(buf=>{Module.files[n]=buf;showfiles();});	//try and resolve it now.
		}
	showfiles();
}
// Unofficial NZP Mobile Overlay: virtual joystick, look zone, action buttons
// Runs before begin() is called so we can hook it properly
(function() {
	"use strict";

	var isTouch = "ontouchstart" in window || navigator.maxTouchPoints > 0;
	if (!isTouch) return;

	var overlay = document.createElement("div");
	overlay.id = "nzp-mobile-overlay";
	overlay.innerHTML =
		'<div class="nzp-touch-control" id="nzp-ads-btn">ADS</div>'
		+ '<div class="nzp-touch-control" id="nzp-weapswap-btn">SWAP</div>'
		+ '<div class="nzp-touch-control" id="nzp-joystick-base">'
		+ '<div id="nzp-joystick-knob"></div></div>'
		+ '<div class="nzp-touch-control" id="nzp-look-zone"></div>'
		+ '<div class="nzp-touch-control" id="nzp-fire-btn">FIRE</div>'
		+ '<div class="nzp-touch-control" id="nzp-jump-btn">JUMP</div>'
		+ '<div class="nzp-touch-control" id="nzp-crouch-btn">CRCH</div>'
		+ '<div class="nzp-touch-control" id="nzp-reload-btn">RLD</div>'
		+ '<div class="nzp-touch-control" id="nzp-use-btn">USE</div>'
		+ '<div class="nzp-touch-control" id="nzp-grenade-btn">GRN</div>';
	document.body.appendChild(overlay);

	var origBegin = window.begin;
	window.begin = function() {
		origBegin.apply(window, arguments);
		overlay.style.display = "block";
	};

	var canvas = document.getElementById("canvas");

	// If game already started, show overlay immediately
	if (window.Module.began) {
		overlay.style.display = "block";
	}

	// Fallback: force overlay visible on touch devices after delay
	setTimeout(function() {
		if (isTouch && overlay.style.display !== "block") {
			overlay.style.display = "block";
		}
	}, 2000);

	// Wait for FTE engine to initialize (sets up FTEC.evcb callbacks)
	var engineReady = false;
	var readyInterval = setInterval(function() {
		if (window.FTEC && window.FTEC.evcb.key) {
			engineReady = true;
			updateDebug("engine ready");
			clearInterval(readyInterval);
		}
	}, 500);
	setTimeout(function() { clearInterval(readyInterval); }, 10000);

	// FTE engine uses its own event handlers on the canvas via FTEC.evcb callbacks.
	// Instead of dispatching synthetic DOM events, call those callbacks directly.
	// Key codes: W=87, A=65, S=83, D=68, Space=32, C=67, R=82, E=69, ESC=27
	// Mouse buttons: Left=0, Right=2

	var debugEl = document.createElement("div");
	debugEl.style.cssText = "position:absolute;bottom:150px;left:5px;color:#0f0;"
		+ "font-size:10px;background:rgba(0,0,0,0.7);padding:2px 6px;border-radius:3px;"
		+ "pointer-events:none;";
	debugEl.textContent = "waiting...";
	overlay.appendChild(debugEl);

	function updateDebug(msg) {
		debugEl.textContent = msg;
	}

	// Virtual gamepad via navigator.getGamepads() polyfill
	// Engine polls this each frame in _emscriptenfte_polljoyevents().
	// FTE default gamepad binds (from engine source):
	//   button 0 = A → +jump
	//   button 1 = B → +crouch
	//   button 2 = X → +speed (sprint)
	//   button 3 = Y → +use
	//   button 4 = LB → impulse 10
	//   button 5 = LT → +button3 (grenade)
	//   button 6 = RB → +weaponwheel
	//   button 7 = RT → +attack (fire)
	//   button 8 = Back
	//   button 9 = Start → togglemenu
	//   button 10 = L3 (left stick click) → +speed (sprint)
	//   button 11 = R3 (right stick click)
	//   button 12-15 = D-pad up/down/left/right
	// Our mobile mapping:
	//   Fire button → button 7 (RT, +attack)
	//   Jump button → button 0 (A, +jump)
	//   Crouch button → button 1 (B, +crouch)
	//   Reload button → button 3 (Y, +reload) - observed to reload
	//   Use button → button 2 (X, +use) - try X for interact
	//   Double-tap joystick → button 2 (X, +speed/sprint) - FTE binds +speed to X
	var virtualPad = {
		index: 0,
		id: "NZP Virtual Gamepad",
		mapping: "standard",
		axes: [0, 0, 0, 0],
		buttons: []
	};
	for (var i = 0; i < 16; i++) {
		virtualPad.buttons.push({ pressed: false, value: 0, lastframe: false });
	}

	// Sprint: FTE binds +speed to L3 (button 10) by default, but NZP may override.
	// Fallback: send Shift (keycode 16) which is the default Quake sprint key.
	var shiftKey = 16;

	var origGetGamepads = navigator.getGamepads;
	navigator.getGamepads = function() {
		var pads;
		try {
			pads = origGetGamepads ? origGetGamepads.call(navigator) : [];
		} catch(e) {
			pads = [];
		}
		var result = [virtualPad];
		for (var i = 0; i < pads.length; i++) {
			if (pads[i] && pads[i].index !== 0) {
				result.push(pads[i]);
			}
		}
		return result;
	};

	function setGamepadButton(index, pressed) {
		if (index < 0 || index >= virtualPad.buttons.length) return;
		virtualPad.buttons[index].pressed = pressed;
		virtualPad.buttons[index].value = pressed ? 1 : 0;
	}

	function callButton(button, pressed) {
		if (!engineReady) {
			updateDebug("not ready");
			return;
		}
		window.getWasmTableEntry(window.FTEC.evcb.button)(0, pressed, button);
		updateDebug("btn " + button + (pressed ? " down" : " up"));
	}

	// FTE evcb.mouse signature: (keyboardid, pointerlock, x, y, 0, 0)
	// When pointer-locked, x/y are movement deltas. We simulate that.
	function callMouseMove(dx, dy) {
		if (!engineReady) {
			updateDebug("not ready");
			return;
		}
		window.getWasmTableEntry(window.FTEC.evcb.mouse)(0, false, dx, dy, 0, 0);
		updateDebug("look " + dx.toFixed(1) + "," + dy.toFixed(1));
	}

	// Joystick: map to gamepad axes 0 (strafe) and 1 (forward/back)
	// Double-tap-hold sprint: two touchstarts within 400ms → button 2 (X, +speed)
	var joystick = document.getElementById("nzp-joystick-base");
	var knob = document.getElementById("nzp-joystick-knob");
	var joyCenter = { x: 0, y: 0 };
	var joyActive = false;
	var joyId = -1;
	var lastJoyTap = 0;
	var joyDeflected = false;

	var sprintActive = false;

	function activateSprint() {
		if (sprintActive) return;
		sprintActive = true;
		setGamepadButton(10, true);
		// Keyboard fallback: Shift = default +speed key in Quake
		getWasmTableEntry(window.FTEC.evcb.key)(0, true, shiftKey, 0);
		updateDebug("sprint L3(10) on");
	}

	function deactivateSprint() {
		if (!sprintActive) return;
		sprintActive = false;
		setGamepadButton(10, false);
		getWasmTableEntry(window.FTEC.evcb.key)(0, false, shiftKey, 0);
		updateDebug("sprint L3(10) off");
	}

	joystick.addEventListener("touchstart", function(e) {
		e.preventDefault();
		var t = e.changedTouches[0];
		var r = joystick.getBoundingClientRect();
		joyCenter = { x: r.left + r.width / 2, y: r.top + r.height / 2 };
		joyActive = true;
		joyId = t.identifier;

		// Double-tap detection - activate on second touchstart even before deflection
		var now = Date.now();
		if (now - lastJoyTap < 400) {
			activateSprint();
		}
		lastJoyTap = now;

		knob.style.background = "rgba(0,255,0,0.6)";
		setTimeout(function() {
			if (joyActive) knob.style.background = "rgba(255,255,255,0.35)";
		}, 100);
	}, { passive: false });

	joystick.addEventListener("touchmove", function(e) {
		e.preventDefault();
		if (!joyActive) return;
		var t = null;
		for (var i = 0; i < e.changedTouches.length; i++) {
			if (e.changedTouches[i].identifier === joyId) { t = e.changedTouches[i]; break; }
		}
		if (!t) return;
		var maxR = joystick.clientWidth / 2;
		var dx = t.clientX - joyCenter.x;
		var dy = t.clientY - joyCenter.y;
		var dist = Math.sqrt(dx * dx + dy * dy);
		joyDeflected = dist > 10;
		if (dist > maxR) {
			dx = dx * (maxR / dist);
			dy = dy * (maxR / dist);
		}
		knob.style.transform = "translate(" + dx + "px," + dy + "px)";
		virtualPad.axes[0] = dx / maxR;
		virtualPad.axes[1] = dy / maxR;
		updateDebug("axis " + virtualPad.axes[0].toFixed(2) + "," + virtualPad.axes[1].toFixed(2));
	}, { passive: false });

	function resetJoy() {
		if (!joyActive) return;
		knob.style.transform = "translate(0,0)";
		virtualPad.axes[0] = 0;
		virtualPad.axes[1] = 0;
		joyActive = false;
		joyId = -1;
		joyDeflected = false;
		knob.style.background = "rgba(255,255,255,0.35)";
		deactivateSprint();
		updateDebug("joy reset");
	}

	joystick.addEventListener("touchend", function(e) {
		e.preventDefault();
		for (var i = 0; i < e.changedTouches.length; i++) {
			if (e.changedTouches[i].identifier === joyId) {
				resetJoy();
				break;
			}
		}
	}, { passive: false });

	joystick.addEventListener("touchcancel", function(e) {
		e.preventDefault();
		for (var i = 0; i < e.changedTouches.length; i++) {
			if (e.changedTouches[i].identifier === joyId) {
				resetJoy();
				break;
			}
		}
	}, { passive: false });

	// Look zone: distinguish tap (menu click) from drag (camera look)
	// Look zone variables (required by look zone handlers below)
	var lookZone = document.getElementById("nzp-look-zone");
	var lookId = -1;
	var lastLook = { x: 0, y: 0 };
	var lookStart = { x: 0, y: 0 };
	var lookDragged = false;
	var lookScale = 1.5;
	var lookZoneScale = 3.0;

	// Full-screen tap layer for menu interaction (captures taps everywhere)
	var tapLayer = document.createElement("div");
	tapLayer.id = "nzp-tap-layer";
	tapLayer.style.cssText = "position:fixed;inset:0;z-index:9990;pointer-events:auto;touch-action:none;";
	document.body.appendChild(tapLayer);

	var tapId = -1;
	var lastTap = { x: 0, y: 0 };
	var tapStart = { x: 0, y: 0 };
	var tapDragged = false;
	var tapThreshold = 8; // pixels

	// Cache canvas scale for touch coordinate conversion
	var canvasScale = { x: 1, y: 1 };
	var canvasOffset = { x: 0, y: 0 };

	// Recalculate canvas scale when viewport changes (fullscreen, orientation)
	function updateCanvasScale() {
		var canvas = document.getElementById("canvas");
		if (!canvas) return;
		var rect = canvas.getBoundingClientRect();
		if (rect.width > 0 && rect.height > 0) {
			canvasScale.x = canvas.width / rect.width;
			canvasScale.y = canvas.height / rect.height;
			canvasOffset.x = rect.left;
			canvasOffset.y = rect.top;
			updateDebug("scale " + canvasScale.x.toFixed(2) + "," + canvasScale.y.toFixed(2) + " off " + canvasOffset.x + "," + canvasOffset.y);
		}
	}

	// Recalculate on fullscreen/orientation changes
	document.addEventListener("fullscreenchange", function() { setTimeout(updateCanvasScale, 100); });
	document.addEventListener("webkitfullscreenchange", function() { setTimeout(updateCanvasScale, 100); });
	window.addEventListener("orientationchange", function() { setTimeout(updateCanvasScale, 100); });
	window.addEventListener("resize", function() { setTimeout(updateCanvasScale, 100); });
	// Initial scale calculation
	setTimeout(updateCanvasScale, 500);

	// Convert touch client coords to canvas-relative coords (scaled for CSS/devicePixelRatio)
	// Uses cached scale for performance, recalculates if scale is stale
	function touchToCanvasCoords(t) {
		var canvas = document.getElementById("canvas");
		var rect = canvas.getBoundingClientRect();
		// Recalculate scale if viewport changed since last update
		if (Math.abs(rect.left - canvasOffset.x) > 1 || Math.abs(rect.top - canvasOffset.y) > 1) {
			updateCanvasScale();
		}
		var x = (t.clientX - rect.left) * (canvas.width / rect.width);
		var y = (t.clientY - rect.top) * (canvas.height / rect.height);
		return { x: x, y: y };
	}

	// Send absolute mouse position to engine (pointerlock=true means absolute coords)
	function sendMousePosition(x, y) {
		if (!engineReady) return;
		window.getWasmTableEntry(window.FTEC.evcb.mouse)(0, true, x, y, 0, 0);
	}

	function sendTapClick(t) {
		var cc = touchToCanvasCoords(t);
		sendMousePosition(cc.x, cc.y);
		callButton(0, true);
		callButton(0, false);
		updateDebug("tap " + t.clientX + "," + t.clientY + " -> " + cc.x.toFixed(1) + "," + cc.y.toFixed(1));
	}

	tapLayer.addEventListener("touchstart", function(e) {
		var t = e.changedTouches[0];
		tapId = t.identifier;
		lastTap = { x: t.clientX, y: t.clientY };
		tapStart = { x: t.clientX, y: t.clientY };
		tapDragged = false;
	}, { passive: false });

	tapLayer.addEventListener("touchmove", function(e) {
		for (var i = 0; i < e.changedTouches.length; i++) {
			var t = e.changedTouches[i];
			if (t.identifier !== tapId) continue;
			var distFromStart = Math.sqrt(
				(t.clientX - tapStart.x) * (t.clientX - tapStart.x) +
				(t.clientY - tapStart.y) * (t.clientY - tapStart.y));
			if (distFromStart > tapThreshold) {
				tapDragged = true;
			}
			var cc = touchToCanvasCoords(t);
			sendMousePosition(cc.x, cc.y);
			if (tapDragged) {
				var dx = (t.clientX - lastTap.x) * lookZoneScale;
				var dy = (t.clientY - lastTap.y) * lookZoneScale;
				callMouseMove(dx, dy);
			}
			lastTap = { x: t.clientX, y: t.clientY };
		}
	}, { passive: false });

	function endTap(t) {
		if (t.identifier !== tapId) return false;
		tapId = -1;
		if (!tapDragged) {
			sendTapClick(t);
		}
		return true;
	}

	tapLayer.addEventListener("touchend", function(e) {
		for (var i = 0; i < e.changedTouches.length; i++) {
			if (endTap(e.changedTouches[i])) break;
		}
	}, { passive: false });

	tapLayer.addEventListener("touchcancel", function(e) {
		for (var i = 0; i < e.changedTouches.length; i++) {
			if (endTap(e.changedTouches[i])) break;
		}
	}, { passive: false });

	// Recalculate canvas scale when viewport changes (fullscreen, orientation)
	function updateCanvasScale() {
		var canvas = document.getElementById("canvas");
		if (!canvas) return;
		var rect = canvas.getBoundingClientRect();
		if (rect.width > 0 && rect.height > 0) {
			canvasScale.x = canvas.width / rect.width;
			canvasScale.y = canvas.height / rect.height;
			canvasOffset.x = rect.left;
			canvasOffset.y = rect.top;
			updateDebug("scale " + canvasScale.x.toFixed(2) + "," + canvasScale.y.toFixed(2) + " off " + canvasOffset.x + "," + canvasOffset.y);
		}
	}

	// Recalculate on fullscreen/orientation changes
	document.addEventListener("fullscreenchange", function() { setTimeout(updateCanvasScale, 100); });
	document.addEventListener("webkitfullscreenchange", function() { setTimeout(updateCanvasScale, 100); });
	window.addEventListener("orientationchange", function() { setTimeout(updateCanvasScale, 100); });
	window.addEventListener("resize", function() { setTimeout(updateCanvasScale, 100); });
	// Initial scale calculation
	setTimeout(updateCanvasScale, 500);

	// Convert touch client coords to canvas-relative coords (scaled for CSS/devicePixelRatio)
	// Uses cached scale for performance, recalculates if scale is stale
	function touchToCanvasCoords(t) {
		var canvas = document.getElementById("canvas");
		var rect = canvas.getBoundingClientRect();
		// Recalculate scale if viewport changed since last update
		if (Math.abs(rect.left - canvasOffset.x) > 1 || Math.abs(rect.top - canvasOffset.y) > 1) {
			updateCanvasScale();
		}
		var x = (t.clientX - rect.left) * (canvas.width / rect.width);
		var y = (t.clientY - rect.top) * (canvas.height / rect.height);
		return { x: x, y: y };
	}

	// Send absolute mouse position to engine (pointerlock=true means absolute coords)
	function sendMousePosition(x, y) {
		if (!engineReady) return;
		window.getWasmTableEntry(window.FTEC.evcb.mouse)(0, true, x, y, 0, 0);
	}

	lookZone.addEventListener("touchstart", function(e) {
		e.preventDefault();
		var t = e.changedTouches[0];
		lookId = t.identifier;
		lastLook = { x: t.clientX, y: t.clientY };
		lookStart = { x: t.clientX, y: t.clientY };
		lookDragged = false;
		if (adsActive) {
			updateDebug("ads move start");
		} else {
			// Send absolute position so reticle appears under finger (fixes menu alignment)
			var cc = touchToCanvasCoords(t);
			sendMousePosition(cc.x, cc.y);
			updateDebug("touch " + t.clientX + "," + t.clientY + " -> " + cc.x.toFixed(1) + "," + cc.y.toFixed(1));
		}
	}, { passive: false });

	lookZone.addEventListener("touchmove", function(e) {
		e.preventDefault();
		for (var i = 0; i < e.changedTouches.length; i++) {
			var t = e.changedTouches[i];
			if (t.identifier !== lookId) continue;
			if (adsActive) {
				// ADS: right side sends movement (strafe/forward)
				var dx = (t.clientX - lastLook.x) * 3.0;
				var dy = (t.clientY - lastLook.y) * 3.0;
				virtualPad.axes[0] = dx / 40;
				virtualPad.axes[1] = dy / 40;
				// Clamp
				if (virtualPad.axes[0] > 1) virtualPad.axes[0] = 1;
				if (virtualPad.axes[0] < -1) virtualPad.axes[0] = -1;
				if (virtualPad.axes[1] > 1) virtualPad.axes[1] = 1;
				if (virtualPad.axes[1] < -1) virtualPad.axes[1] = -1;
				updateDebug("ads move " + virtualPad.axes[0].toFixed(2) + "," + virtualPad.axes[1].toFixed(2));
			} else {
				// Normal: look zone sends look deltas
				// Detect if this is a drag (not just tap jitter)
				var distFromStart = Math.sqrt(
					(t.clientX - lookStart.x) * (t.clientX - lookStart.x) +
					(t.clientY - lookStart.y) * (t.clientY - lookStart.y));
				if (distFromStart > tapThreshold) {
					lookDragged = true;
				}
				// Send absolute position for reticle tracking
				var cc = touchToCanvasCoords(t);
				sendMousePosition(cc.x, cc.y);
				// Also send deltas for look sensitivity during gameplay
				if (lookDragged) {
					var dx = (t.clientX - lastLook.x) * lookZoneScale;
					var dy = (t.clientY - lastLook.y) * lookZoneScale;
					callMouseMove(dx, dy);
				}
			}
			lastLook = { x: t.clientX, y: t.clientY };
		}
	}, { passive: false });

	function endLook(t) {
		if (t.identifier !== lookId) return false;
		lookId = -1;
		if (adsActive) {
			// ADS: reset movement axes on release
			virtualPad.axes[0] = 0;
			virtualPad.axes[1] = 0;
			// If not dragged significantly, fire
			if (!lookDragged) {
				setGamepadButton(7, true);
				setGamepadButton(7, false);
				updateDebug("ads fire");
			} else {
				updateDebug("ads move stop");
			}
		} else if (!lookDragged) {
			// If not dragged significantly, send click events for menu interaction
			callButton(0, true);
			callButton(0, false);
		}
		return true;
	}

	lookZone.addEventListener("touchend", function(e) {
		e.preventDefault();
		for (var i = 0; i < e.changedTouches.length; i++) {
			if (endLook(e.changedTouches[i])) break;
		}
	}, { passive: false });

	lookZone.addEventListener("touchcancel", function(e) {
		e.preventDefault();
		for (var i = 0; i < e.changedTouches.length; i++) {
			if (endLook(e.changedTouches[i])) break;
		}
	}, { passive: false });

		// ADS button: hold for zoom, move to aim while scoped
	var adsBtn = document.getElementById("nzp-ads-btn");
	var adsTouchId = -1;
	var adsLast = { x: 0, y: 0 };
	var adsMoved = false;
	var adsActive = false;

	// Right-side action buttons to hide during ADS
	var rightButtons = ["nzp-fire-btn", "nzp-jump-btn", "nzp-crouch-btn", "nzp-reload-btn", "nzp-use-btn", "nzp-grenade-btn"];

	function hideRightButtons() {
		for (var i = 0; i < rightButtons.length; i++) {
			document.getElementById(rightButtons[i]).style.display = "none";
		}
	}
	function showRightButtons() {
		for (var i = 0; i < rightButtons.length; i++) {
			document.getElementById(rightButtons[i]).style.display = "";
		}
	}

	adsBtn.addEventListener("touchstart", function(e) {
		e.preventDefault();
		var t = e.changedTouches[0];
		adsTouchId = t.identifier;
		adsLast = { x: t.clientX, y: t.clientY };
		adsMoved = false;
		adsActive = true;
		callButton(2, true);
		hideRightButtons();
		updateDebug("ads on");
	}, { passive: false });
	adsBtn.addEventListener("touchmove", function(e) {
		e.preventDefault();
		for (var i = 0; i < e.changedTouches.length; i++) {
			var t = e.changedTouches[i];
			if (t.identifier !== adsTouchId) continue;
			var dx = (t.clientX - adsLast.x) * lookScale;
			var dy = (t.clientY - adsLast.y) * lookScale;
			if (dx !== 0 || dy !== 0) {
				callMouseMove(dx, dy);
				adsMoved = true;
			}
			adsLast = { x: t.clientX, y: t.clientY };
		}
	}, { passive: false });
	function adsRelease(t) {
		if (t.identifier !== adsTouchId) return false;
		adsTouchId = -1;
		adsActive = false;
		callButton(2, false);
		showRightButtons();
		updateDebug("ads off" + (adsMoved ? " (aimed)" : ""));
		return true;
	}
	adsBtn.addEventListener("touchend", function(e) {
		e.preventDefault();
		for (var i = 0; i < e.changedTouches.length; i++) {
			if (adsRelease(e.changedTouches[i])) break;
		}
	}, { passive: false });
	adsBtn.addEventListener("touchcancel", function(e) {
		e.preventDefault();
		for (var i = 0; i < e.changedTouches.length; i++) {
			if (adsRelease(e.changedTouches[i])) break;
		}
	}, { passive: false });

	// Fire button: map to gamepad Right Trigger (button 7) → +attack (fire)
	// FTE default: Right Trigger fires weapon
	var fireBtn = document.getElementById("nzp-fire-btn");
	fireBtn.addEventListener("touchstart", function(e) {
		e.preventDefault();
		setGamepadButton(7, true);
		updateDebug("fire RT(7) on");
	}, { passive: false });
	fireBtn.addEventListener("touchend", function(e) {
		e.preventDefault();
		setGamepadButton(7, false);
		updateDebug("fire RT(7) off");
	}, { passive: false });
	fireBtn.addEventListener("touchcancel", function(e) {
		e.preventDefault();
		setGamepadButton(7, false);
		updateDebug("fire RT(7) off");
	}, { passive: false });

	// Menu click button: sends mousedown+mouseup at canvas center
	var menuBtn = document.createElement("div");
	menuBtn.className = "nzp-touch-control";
	menuBtn.id = "nzp-menu-btn";
	menuBtn.style.cssText = "bottom: 140px; right: 20px; width: 40px; height: 40px;"
		+ " background: rgba(255,255,255,0.15); border-radius: 50%; color: #fff;"
		+ " font-size: 9px; display: flex; align-items: center; justify-content: center;";
	menuBtn.textContent = "MENU";
	overlay.appendChild(menuBtn);
	menuBtn.addEventListener("touchstart", function(e) {
		e.preventDefault();
		if (engineReady) {
			getWasmTableEntry(window.FTEC.evcb.key)(0, true, 27, 0);
		}
	}, { passive: false });
	menuBtn.addEventListener("touchend", function(e) {
		e.preventDefault();
		if (engineReady) {
			getWasmTableEntry(window.FTEC.evcb.key)(0, false, 27, 0);
		}
	}, { passive: false });
	menuBtn.addEventListener("touchcancel", function(e) {
		e.preventDefault();
		if (engineReady) {
			getWasmTableEntry(window.FTEC.evcb.key)(0, false, 27, 0);
		}
	}, { passive: false });

	// Action buttons: map to FTE default gamepad indices
	// Jump → button 0 (A, +jump)
	// Crouch → button 1 (B, +crouch)
	// Reload → button 3 (Y, +reload) - observed to reload
	// Use → button 13 (dpad down, +use) - observed to work
	// Grenade → button 5 (LT, +button3)
	// Weapon Swap → button 2 (X, +speed) - observed to swap weapons in NZP
	var buttonDefs = [
		{ id: "nzp-jump-btn",   gpBtn: 0 },
		{ id: "nzp-crouch-btn", gpBtn: 1 },
		{ id: "nzp-reload-btn", gpBtn: 3 },
		{ id: "nzp-use-btn",    gpBtn: 13 },
		{ id: "nzp-grenade-btn", gpBtn: 5 },
		{ id: "nzp-weapswap-btn", gpBtn: 2 }
	];

	for (var b = 0; b < buttonDefs.length; b++) {
		(function(def) {
			var btn = document.getElementById(def.id);
			btn.addEventListener("touchstart", function(e) {
				e.preventDefault();
				setGamepadButton(def.gpBtn, true);
				updateDebug(def.id + " on");
			}, { passive: false });
			btn.addEventListener("touchend", function(e) {
				e.preventDefault();
				setGamepadButton(def.gpBtn, false);
				updateDebug(def.id + " off");
			}, { passive: false });
			btn.addEventListener("touchcancel", function(e) {
				e.preventDefault();
				setGamepadButton(def.gpBtn, false);
			}, { passive: false });
		})(buttonDefs[b]);
	}

	// Landscape fullscreen: when device rotates to landscape, go fullscreen.
	// Some mobile browsers require a user gesture for requestFullscreen, but
	// on Android Chrome the orientationchange event works as a gesture.
	// iOS Safari often blocks fullscreen on non-user-gesture, so this is best-effort.
	var inLandscapeFullscreen = false;
	function handleOrientationChange() {
		var landscape = false;
		if (screen.orientation) {
			landscape = screen.orientation.type === "landscape-primary" ||
							screen.orientation.type === "landscape-secondary";
		} else {
			landscape = matchMedia("(orientation: landscape)").matches;
		}
		var canvas = document.getElementById("canvas");
		if (landscape && !document.fullscreenElement && !document.webkitFullscreenElement) {
			// Enter fullscreen on documentElement so overlay stays visible
			if (document.documentElement.requestFullscreen) {
				document.documentElement.requestFullscreen().catch(function() {});
			} else if (document.documentElement.webkitRequestFullscreen) {
				document.documentElement.webkitRequestFullscreen();
			}
			inLandscapeFullscreen = true;
		} else if (!landscape && inLandscapeFullscreen) {
			// Exit fullscreen
			if (document.exitFullscreen) {
				document.exitFullscreen().catch(function() {});
			} else if (document.webkitExitFullscreen) {
				document.webkitExitFullscreen();
			}
			inLandscapeFullscreen = false;
		}
	}
	if (screen.orientation) {
		screen.orientation.addEventListener("change", handleOrientationChange);
	}
	window.addEventListener("orientationchange", handleOrientationChange);
	// Also check on load in case already in landscape
	setTimeout(handleOrientationChange, 500);

	// Mobile soft keyboard for text input fields (console, menu text inputs)
	// Creates a hidden <input> element and routes its input events to the engine
	// as synthetic keyboard events via FTEC.evcb.key.
	//
	// Browser limitations:
	//   - iOS Safari: keyboard may appear but input events can be inconsistent
	//   - Some Android browsers: focus() may not trigger keyboard without user gesture
	//   - Hidden input must still be focusable (opacity:0, position:fixed)
	//   - Enter key handling varies by browser (submit vs newline)
	//
	// Usage: tap CONSOLE button to open console and show keyboard. Tap KEYBOARD
	// button while in a menu text field to type into it. Tap KEYBOARD again or
	// tap outside to dismiss.

	var keyboardOverlay = document.createElement("div");
	keyboardOverlay.id = "nzp-keyboard-overlay";
	keyboardOverlay.style.cssText = "position:fixed;inset:0;z-index:10000;"
		+ "background:rgba(0,0,0,0.5);display:none;";
	keyboardOverlay.innerHTML =
		'<div style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);' +
		'width:90%;max-width:400px;background:rgba(20,20,20,0.95);border-radius:10px;' +
		'padding:15px;">' +
		'<input type="text" id="nzp-keyboard-input" autocomplete="off" autocorrect="off" ' +
		'autocapitalize="off" spellcheck="false" ' +
		'style="width:100%;padding:10px;font-size:16px;background:rgba(0,0,0,0.5);' +
		'color:#fff;border:1px solid rgba(255,255,255,0.3);border-radius:5px;outline:none;">' +
		'<div style="display:flex;justify-content:space-between;margin-top:10px;">' +
		'<button id="nzp-keyboard-cancel" style="padding:8px 16px;background:rgba(100,100,100,0.5);' +
		'color:#fff;border:none;border-radius:5px;">Cancel</button>' +
		'<button id="nzp-keyboard-done" style="padding:8px 16px;background:rgba(40,120,40,0.7);' +
		'color:#fff;border:none;border-radius:5px;">Done</button>' +
		'</div></div>';
	document.body.appendChild(keyboardOverlay);

	var keyboardInput = document.getElementById("nzp-keyboard-input");
	var keyboardActive = false;
	var keyboardTarget = null; // "console" or "menu"

	function openKeyboard(target) {
		if (!engineReady) {
			updateDebug("kb: not ready");
			return;
		}
		keyboardActive = true;
		keyboardTarget = target;
		keyboardOverlay.style.display = "block";
		keyboardInput.value = "";
		// Delay focus to ensure overlay is rendered
		setTimeout(function() {
			keyboardInput.focus();
		}, 100);
		updateDebug("kb: opened (" + target + ")");
	}

	function closeKeyboard() {
		keyboardActive = false;
		keyboardOverlay.style.display = "none";
		keyboardInput.blur();
		updateDebug("kb: closed");
	}

	function sendCharToEngine(ch) {
		if (!engineReady || !ch) return;
		var code = ch.charCodeAt(0);
		var evcbKey = window.FTEC.evcb.key;
		getWasmTableEntry(evcbKey)(0, true, 0, code);
		getWasmTableEntry(evcbKey)(0, false, 0, 0);
	}

	// Track how many chars have been sent to avoid re-sending on input events
	var keyboardCharsSent = 0;

	keyboardInput.addEventListener("input", function(e) {
		var val = e.target.value;
		if (val.length > keyboardCharsSent) {
			// New characters typed: send only the new ones
			for (var i = keyboardCharsSent; i < val.length; i++) {
				sendCharToEngine(val[i]);
			}
		} else if (val.length < keyboardCharsSent) {
			// Text deleted: send backspace for each char removed
			var deleted = keyboardCharsSent - val.length;
			for (var i = 0; i < deleted; i++) {
				getWasmTableEntry(window.FTEC.evcb.key)(0, true, 8, 0);
				getWasmTableEntry(window.FTEC.evcb.key)(0, false, 8, 0);
			}
		}
		keyboardCharsSent = val.length;
	});

	keyboardInput.addEventListener("keydown", function(e) {
		if (e.key === "Enter") {
			getWasmTableEntry(window.FTEC.evcb.key)(0, true, 13, 0);
			getWasmTableEntry(window.FTEC.evcb.key)(0, false, 13, 0);
		}
	});

	document.getElementById("nzp-keyboard-done").addEventListener("click", function() {
		// Flush any characters that were typed but not yet sent
		var val = keyboardInput.value;
		if (val.length > keyboardCharsSent) {
			for (var i = keyboardCharsSent; i < val.length; i++) {
				sendCharToEngine(val[i]);
			}
		}
		keyboardInput.value = "";
		keyboardCharsSent = 0;
		closeKeyboard();
	});
	document.getElementById("nzp-keyboard-cancel").addEventListener("click", function() {
		closeKeyboard();
	});
	keyboardOverlay.addEventListener("click", function(e) {
		if (e.target === keyboardOverlay) closeKeyboard();
	});

	// KEYBOARD button: show soft keyboard for menu text fields
	var kbBtn = document.createElement("div");
	kbBtn.className = "nzp-touch-control";
	kbBtn.id = "nzp-kb-btn";
	kbBtn.style.cssText = "bottom: 30px; left: 160px; width: 40px; height: 40px;"
		+ " background: rgba(120,80,40,0.5); border-radius: 50%; color: #fff;"
		+ " font-size: 9px; display: flex; align-items: center; justify-content: center;"
		+ " border: 2px solid rgba(255,255,255,0.3);";
	kbBtn.textContent = "KB";
	overlay.appendChild(kbBtn);

	kbBtn.addEventListener("touchstart", function(e) {
		e.preventDefault();
		if (keyboardActive) {
			closeKeyboard();
		} else {
			openKeyboard("menu");
		}
	}, { passive: false });

	// Debug label to confirm overlay is present
	var debugLabel = document.createElement("div");
	debugLabel.style.cssText = "position:absolute;top:5px;right:5px;color:#f00;"
		+ "font-size:10px;background:rgba(0,0,0,0.5);padding:2px 6px;border-radius:3px;";
	debugLabel.textContent = "NZP MOBILE";
	overlay.appendChild(debugLabel);
})();

if (window.location.hash != "" || Object.keys(Module.files).length)
	begin();		//if the url has a #foo.fmf then just begin instantly, 
else
	showfiles();	//otherwise show our lame file dropper and wait for the user to click 'go'.
